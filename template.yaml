AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MitsumapCrowdsourcing — anonymous vehicle sightings API for LKQ and Pick N Pull

Parameters:
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for api.mitsumap.com (must be in us-west-1 for regional endpoint)

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref CrowdsourcedTable

Resources:

  # ─── DynamoDB ─────────────────────────────────────────────────────────────

  CrowdsourcedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: JunkyardCrowdsourced
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ─── IAM ──────────────────────────────────────────────────────────────────

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MitsumapCrowdsourcingLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBReadWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource: !GetAtt CrowdsourcedTable.Arn

  # ─── Lambda functions ─────────────────────────────────────────────────────

  GetCrowdsourcedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: MitsumapGetCrowdsourced
      Handler: get_crowdsourced.lambda_handler
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn

  SubmitSightingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: MitsumapSubmitSighting
      Handler: submit_sighting.lambda_handler
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn

  FlagSightingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: MitsumapFlagSighting
      Handler: flag_sighting.lambda_handler
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn

  # ─── API Gateway (native resources — avoids SAM-generated stage naming) ──

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: MitsumapCrowdsourcingApi
      Description: Crowdsourced vehicle sightings at LKQ and Pick N Pull

  CrowdsourcedResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: crowdsourced

  FlagResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref CrowdsourcedResource
      PathPart: flag

  GetCrowdsourcedMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref CrowdsourcedResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetCrowdsourcedFunction.Arn}/invocations"

  PostCrowdsourcedMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref CrowdsourcedResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SubmitSightingFunction.Arn}/invocations"

  OptionsCrowdsourcedMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref CrowdsourcedResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'https://mitsumap.com'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  PostFlagMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref FlagResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FlagSightingFunction.Arn}/invocations"

  OptionsFlagMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref FlagResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'https://mitsumap.com'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetCrowdsourcedMethod
      - PostCrowdsourcedMethod
      - OptionsCrowdsourcedMethod
      - PostFlagMethod
      - OptionsFlagMethod
    Properties:
      RestApiId: !Ref RestApi

  ProdStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

  # ─── Lambda invoke permissions ────────────────────────────────────────────

  GetCrowdsourcedPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GetCrowdsourcedFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/crowdsourced"

  SubmitSightingPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SubmitSightingFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/crowdsourced"

  FlagSightingPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FlagSightingFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/crowdsourced/flag"

  # ─── Custom domain ────────────────────────────────────────────────────────

  ApiDomainName:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: api.mitsumap.com
      RegionalCertificateArn: !Ref CertificateArn
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn: ProdStage
    Properties:
      DomainName: !Ref ApiDomainName
      RestApiId: !Ref RestApi
      Stage: prod

Outputs:

  ApiUrl:
    Description: API base URL (direct, without custom domain)
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  CustomDomainTarget:
    Description: Alias target for the api.mitsumap.com Route 53 record
    Value: !GetAtt ApiDomainName.RegionalDomainName

  CrowdsourcedTableName:
    Description: DynamoDB table name
    Value: !Ref CrowdsourcedTable
